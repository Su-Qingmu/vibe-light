name: Release vibewin (Windows)

on:
  push:
    tags:
      - 'v*'                # tag push (v1.0.0) -> versioned release
    branches:
      - main                # main push -> rolling "latest" release
  workflow_dispatch:         # manual -> artifact only, no release

permissions:
  contents: write            # required by softprops/action-gh-release

# Serialize runs sharing this ref; prevents duplicate asset uploads on rapid pushes
concurrency:
  group: release-vibewin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build vibewin.exe
        working-directory: agent
        run: pyinstaller --noconfirm vibewin.spec

      - name: Upload as run artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: vibewin-windows-x64
          path: agent/dist/vibewin.exe
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # tag push -> use the pushed tag; main push -> "latest" rolling tag
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Vibe-Win {0}', github.ref_name) || 'Vibe-Win (latest)' }}
          generate_release_notes: true
          body: |
            **Install:** download `vibewin-windows-x64.exe`, rename to `vibewin.exe`, double-click.

            **Features:**
            - Online detection via 5s TCP heartbeat
            - UDP broadcast + TCP subnet scan discovery
            - 9 state buttons, brightness slider, RGB color override
            - Persistent host config in `%USERPROFILE%\.config\vibe-light\esp32.json`
          files: |
            agent/dist/vibewin.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}